name: Build and Test Custom R (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    name: Build R-devel (UCRT)
    runs-on: windows-latest
    env:
      R_VERSION: "4.5"
      RTOOLS_VERSION: "45"

    steps:
      - name: Checkout R Source
        uses: actions/checkout@v4

      - name: Install Rtools${{ env.RTOOLS_VERSION }}
        shell: pwsh
        run: |
          choco install rtools -y --no-progress
          # Ensure Rtools is on the path for subsequent steps
          echo "C:\rtools${{ env.RTOOLS_VERSION }}\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\rtools${{ env.RTOOLS_VERSION }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download Windows Build Dependencies (Tcl/Tk & ExtSoft)
        shell: bash
        run: |
          # R cannot build on Windows without these binary blobs in the root
          # These are the current UCRT-compatible bundles for R-devel
          curl -Lo tcltk.zip https://cran.r-project.org/bin/windows/Rtools/rtools45/files/tcltk-8.6.17.zip
          unzip -q tcltk.zip -d .
          
          # We also need the 'extsoft' headers/libs for things like jpeg, png, etc.
          # If not present, base R build will skip these capabilities.
          mkdir -p Tcl share

      - name: Generate Build Metadata
        shell: bash
        run: |
          # The Windows build system strictly requires SVN-REVISION to exist
          printf 'Revision: 00000\nLast Changed Date: %s +0000\n' "$(date -u '+%Y-%m-%d %H:%M:%S')" > SVN-REVISION

      - name: Configure Build (MkRules.local)
        shell: bash
        run: |
          # Use mixed-mode paths (C:/) for the R Makefiles
          cat <<EOF > src/gnuwin32/MkRules.local
          R_ARCH = x64
          BINPREF = C:/rtools${{ env.RTOOLS_VERSION }}/ucrt64/bin/
          TCL_ROOT = $(cygpath -m $(pwd))
          TCL_VERSION = 86
          EOF
          echo "--- Created src/gnuwin32/MkRules.local ---"
          cat src/gnuwin32/MkRules.local

      - name: Build R Core
        shell: bash
        working-directory: src/gnuwin32
        run: |
          # We use 'make' from Rtools. 
          # Note: Parallel builds (-j) can occasionally race on 'manuals', 
          # so we start with -j2 for the main engine.
          make -j2
          
      - name: Build Recommended Packages
        shell: bash
        working-directory: src/gnuwin32
        run: make recommended

      - name: Verify Binary
        shell: bash
        run: |
          ./bin/x64/Rscript.exe --version
          ./bin/x64/R.exe -e "capabilities()"

      - name: Run Basic Tests
        shell: bash
        working-directory: src/gnuwin32
        run: make check-devel