name: Build and Test R

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libreadline-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libcairo2-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libdeflate-dev \
            libicu-dev \
            texinfo \
            wget \
            pkg-config

      - name: Create SVNINFO (required for git clones)
        run: |
          printf 'Revision: 00000\nLast Changed Date: %s +0000\n' \
            "$(date -u '+%Y-%m-%d %H:%M:%S')" > SVNINFO

      - name: Configure
        run: |
          ./configure \
            --with-readline=yes \
            --with-pcre2 \
            --with-cairo \
            --with-libpng \
            --without-x \
            --without-recommended-packages

      - name: Build
        run: make -j$(nproc)

      - name: Verify R binary
        run: bin/R --version

      - name: Run tests
        run: make check
        timeout-minutes: 60

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14   # Apple Silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            gcc \
            readline \
            pcre2 \
            openssl@3 \
            libpng \
            cairo \
            pango \
            xz \
            jpeg-turbo \
            libtiff \
            libdeflate \
            icu4c \
            pkg-config \
            texinfo

      - name: Set up Homebrew environment
        run: |
          BREW=/opt/homebrew
          GCC_VER=$(ls ${BREW}/bin/gfortran-* 2>/dev/null | grep -oE '[0-9]+$' | sort -n | tail -1)
          echo "FC=${BREW}/bin/gfortran-${GCC_VER}" >> $GITHUB_ENV
          echo "F77=${BREW}/bin/gfortran-${GCC_VER}" >> $GITHUB_ENV
          # Make keg-only packages visible to pkg-config
          echo "PKG_CONFIG_PATH=${BREW}/opt/readline/lib/pkgconfig:${BREW}/opt/openssl@3/lib/pkgconfig:${BREW}/opt/icu4c/lib/pkgconfig:${BREW}/opt/jpeg-turbo/lib/pkgconfig:${BREW}/lib/pkgconfig" >> $GITHUB_ENV
          echo "LDFLAGS=-L${BREW}/lib -L${BREW}/opt/readline/lib -L${BREW}/opt/openssl@3/lib -L${BREW}/opt/icu4c/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${BREW}/include -I${BREW}/opt/readline/include -I${BREW}/opt/openssl@3/include -I${BREW}/opt/icu4c/include" >> $GITHUB_ENV
          echo "${BREW}/bin" >> $GITHUB_PATH

      - name: Create SVNINFO (required for git clones)
        run: |
          printf 'Revision: 00000\nLast Changed Date: %s +0000\n' \
            "$(date -u '+%Y-%m-%d %H:%M:%S')" > SVNINFO

      - name: Configure
        run: |
          ./configure \
            --with-readline=yes \
            --with-pcre2 \
            --with-cairo \
            --with-libpng \
            --without-aqua \
            --without-x \
            --without-recommended-packages

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Verify R binary
        run: bin/R --version

      - name: Run tests
        run: make check
        timeout-minutes: 60
